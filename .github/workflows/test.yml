name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Package tests
        shell: bash
        run: bash tests/run.sh
      - name: Package lint
        shell: bash
        run: bash .claude/skills/cc-loop/scripts/lint-package.sh
