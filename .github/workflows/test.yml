name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On main a run finishes; a newer push cancels a PR run, not the main run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Package tests
        shell: bash
        run: bash tests/run.sh
      - name: Package lint
        shell: bash
        run: bash .claude/skills/cc-loop/scripts/lint-package.sh
