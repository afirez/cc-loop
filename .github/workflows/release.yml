name: release

on:
  push:
    tags: ['v*']

# Serialize releases; two tags pushed together must not race.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! printf '%s\n' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "tag $tag is not vX.Y.Z" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $tag is not on main" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists" >&2
            exit 1
          fi
      - name: Package tests
        run: sh tests/run.sh
      - name: Package lint
        run: sh .claude/skills/cc-loop/scripts/lint-package.sh
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/cc-loop-${GITHUB_REF_NAME}.tar.gz" .claude/skills/cc-loop
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          (cd .claude/skills && zip -qr "../../dist/cc-loop-${GITHUB_REF_NAME}.zip" cc-loop)
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=true
          highest=$(gh release list -L 100 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName' | sort -V | tail -1)
          if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$GITHUB_REF_NAME" | sort -V | tail -1)" != "$GITHUB_REF_NAME" ]; then
            latest=false
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --latest="$latest"
